name: VS Code checks
on:
  workflow_call:
    inputs:
      editors_ref:
        required: true
        type: string
      lsp_artifact:
        required: true
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packaged-extension:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: neknaj/circuitgame2-editors
          ref: ${{ inputs.editors_ref || github.sha }}
          persist-credentials: false
      - name: Download the candidate language server
        if: inputs.lsp_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.lsp_artifact }}
          path: ${{ runner.temp }}/candidate-lsp
      - name: Use the candidate language server
        if: inputs.lsp_artifact != ''
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP "candidate-lsp") -Encoding utf8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install the pinned language server
        if: inputs.lsp_artifact == ''
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          $root = Join-Path $env:RUNNER_TEMP "ncg2-cli"
          $cli = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".github/ncg2-cli-rev") -Raw -Encoding utf8).Trim()
          cargo +1.99.1 install --debug --locked --git https://github.com/neknaj/circuitgame2-cli --rev $cli --bin circuitgame2-lsp --root $root
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $root "bin") -Encoding utf8
      - run: npm ci
      - run: npm run package
      - run: npm test
      - name: Upload the tested VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: circuitgame2.vsix
          path: vscode/circuitgame2.vsix
          if-no-files-found: error
